# Start windows numbering at 1
set -g base-index 1

# Start panes numbering at 1
setw -g pane-base-index 1

# Switch windows using Ctrl-h and Ctrl-l without prefix
bind -n M-h previous-window
bind -n M-l next-window

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# For tmux version 3.0 or higher
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"

# --- Custom Minimalist Status Bar ---

# Position at bottom and align windows to the left
set -g status-position bottom
set -g status-justify left

# Make the background default (transparent/pure black) and text white
set -g status-style 'bg=default,fg=white'

# Left side: Session name with a terminal icon
set -g status-left '#[fg=green,bold]  #S #[fg=gray]│ '
set -g status-left-length 40

# Window status (Inactive): Dimmed and minimal
setw -g window-status-format '#[fg=gray] #I:#W '

# Window status (Active): Highlighted with your cyan color
setw -g window-status-current-format '#[fg=#56B6C2,bold]  #I:#W '

# Right side: Simple Date and Time
set -g status-right '#[fg=gray] %Y-%m-%d │ #[fg=white,bold]%H:%M '
