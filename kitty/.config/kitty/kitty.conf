# --- Font ---
font_family      Cascadia Code NF SemiBold
bold_font        Cascadia Code NF Bold
italic_font      Cascadia Code NF SemiBold Italic
bold_italic_font Cascadia Code NF Bold Italic
font_size        12
modify_font cell_height 110%

# --- Window ---
# 112 columns x 33 lines (cells)
remember_window_size  no
initial_window_width  112c
initial_window_height 33c
hide_window_decorations yes
window_padding_width 10
background_opacity 0.7
background_blur 1

# --- Theme ---
# BEGIN_KITTY_THEME
# Tokyo Night
include current-theme.conf
# END_KITTY_THEME

# --- Colors (overrides, must come after the theme include) ---
background #000000
foreground #e3e3e3
cursor     #e3e3e3
color6     #00E3FF
color7     #e3e3e3
color15    #e3e3e3
color8     #b0b0b0
color14    #56B6C2

# --- Cursor Trail ---
cursor_trail 1
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# --- Keybindings ---
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+n new_os_window_with_cwd
map ctrl+shift+k scroll_line_up
map ctrl+shift+j scroll_line_down
